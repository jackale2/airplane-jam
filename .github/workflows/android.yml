name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      # repository variables (Settings > Secrets and variables > Actions > Variables), both optional
      PLAY_GAMES_APP_ID: ${{ vars.PLAY_GAMES_APP_ID }}
      VITE_LEGAL_URL: ${{ vars.LEGAL_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (fast ones; the 200-level generator test is run locally)
        run: npm run test:fast

      - name: Build web app
        run: npm run build

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: airplane-jam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release bundle for Google Play. Signed with the upload key when the four signing secrets are
      # set (see docs/PLAY_RELEASE.md); otherwise built unsigned, which Play does not accept.
      - name: Restore upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: building an UNSIGNED release bundle (Google Play needs it signed, see docs/PLAY_RELEASE.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle (.aab)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.ready == 'true' && format('{0}/upload.jks', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Check the bundle signature
        if: steps.keystore.outputs.ready == 'true'
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | grep "jar verified"

      - name: Upload signed release bundle
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: airplane-jam-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload unsigned release bundle
        if: steps.keystore.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: airplane-jam-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Airplane Jam build ${VERSION_CODE}"
            echo "- Version code: ${VERSION_CODE}"
            echo "- Release bundle: ${{ steps.keystore.outputs.ready == 'true' && 'signed (ready for Google Play)' || 'UNSIGNED (add the signing secrets, see docs/PLAY_RELEASE.md)' }}"
            echo "- Play Games cloud save: ${PLAY_GAMES_APP_ID:+on (project ${PLAY_GAMES_APP_ID})}${PLAY_GAMES_APP_ID:-off (set the PLAY_GAMES_APP_ID variable)}"
            echo "- Legal pages: ${VITE_LEGAL_URL:-not set (set the LEGAL_URL variable)}"
          } >> "$GITHUB_STEP_SUMMARY"
