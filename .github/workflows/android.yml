name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (fast ones; the 200-level generator test is run locally)
        run: npm run test:fast

      - name: Build web app
        run: npm run build

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: airplane-jam-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Signed release bundle for Google Play. Runs only when the four signing secrets are set
      # (repository Settings > Secrets and variables > Actions); see README "Release build".
      - name: Restore upload keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets: skipping the release bundle."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release bundle (.aab)
        if: steps.keystore.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release bundle
        if: steps.keystore.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: airplane-jam-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
