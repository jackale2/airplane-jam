<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9fd7ee" />
    <title>Airplane Jam</title>
    <style>
      html, body { margin: 0; height: 100%; background: #9fd7ee; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      /* keep the game out of notches and system bars */
      #game { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
