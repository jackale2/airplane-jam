<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#6ec8f5" />
    <meta name="description" content="Airplane Jam: a calm, satisfying puzzle. Tap planes out of a crowded apron and board matching passengers." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Airplane Jam</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html, body { margin: 0; height: 100%; background: #6ec8f5; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      /* keep the game out of notches and system bars; the canvas is fitted inside #game */
      #frame { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
      #game { width: 100%; height: 100%; }
      #game canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="frame"><div id="game"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
